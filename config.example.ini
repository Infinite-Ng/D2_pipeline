; D2_pipeline 配置模板。复制为 config.ini 后填真实值。
; config.ini 已被 .gitignore 挡住，不会提交到 public 仓库。
; 真实的内网主机名/仓库名/账号名/收件邮箱等属于内部信息，切勿写进本模板或提交到仓库。

[d2]
host = your-d2-host        ; D2 内网主机名（内部服务器名）
repo = your_repository     ; docbase / repository 名
account = YOUR_ACCOUNT     ; 取数/发信账号（其 inbox 即数据源）

[report]
language = en                              ; 邮件正文语言：en
cover_weekend_on_monday = true             ; 周一的“昨天”是否覆盖上周五~周日
subject_prefix = [D2 Daily]                ; 邮件主题前缀
report_title = Documentum D2 Daily Intake  ; 报告大标题

[email]
; 收件人，逗号分隔。真实地址请写到本地 config.ini。
recipients = someone@example.org, team@example.org
; 可选：以某邮箱身份发信（需 Outlook 对该邮箱有 send-on-behalf 权限）。留空=默认身份。
send_from =
